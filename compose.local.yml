services:
  mysql:
    image: mysql:8.0.43
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-mingler}
      MYSQL_USER: ${MYSQL_USER:-mingler}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-mingler}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      TZ: Asia/Seoul
    ports:
      - "127.0.0.1:${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "5"

  app:
    build:
      context: .
      target: runtime
    environment:
      SPRING_PROFILES_ACTIVE: local
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-mingler}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul
      DB_USERNAME: ${MYSQL_USER:-mingler}
      DB_PASSWORD: ${MYSQL_PASSWORD:-mingler}
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: ${HIKARI_MAXIMUM_POOL_SIZE:-10}
      JWT_SECRET: ${JWT_SECRET:-mingler-local-development-secret-key-change-me}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-virtual}
      TOSS_CLIENT_KEY: ${TOSS_CLIENT_KEY:-}
      TOSS_SECRET_KEY: ${TOSS_SECRET_KEY:-}
      TOSS_TEST_CODE: ${TOSS_TEST_CODE:-}
      TZ: Asia/Seoul
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "${APP_HOST_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  mysql-data:
