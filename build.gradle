plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'org.hibernate.orm' version '7.4.1.Final'
    id 'org.graalvm.buildtools.native' version '1.1.1'
}

group = 'com.lsg'
version = '0.0.1-SNAPSHOT'
description = 'Mingler'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // 웹·SSR·운영
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'       // Spring MVC 웹 애플리케이션
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'    // Thymeleaf SSR 템플릿
    implementation 'org.thymeleaf.extras:thymeleaf-extras-springsecurity6'     // 템플릿 보안 표현식
    implementation 'org.springframework.boot:spring-boot-starter-actuator'     // 상태 확인과 운영 지표

    // 데이터베이스·캐시
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'     // JPA와 Hibernate
    implementation 'org.springframework.boot:spring-boot-starter-cache'        // Spring Cache 추상화
    implementation 'com.github.ben-manes.caffeine:caffeine'                    // 로컬 인메모리 캐시
    runtimeOnly 'com.mysql:mysql-connector-j'                                  // MySQL JDBC 드라이버

    // 보안·인증
    implementation 'org.springframework.boot:spring-boot-starter-security'     // Spring Security
    implementation 'org.bouncycastle:bcprov-jdk18on:1.78.1'                    // Argon2id 비밀번호 해싱
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'                           // JWT API
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'                              // JWT 구현체
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'                           // JWT JSON 직렬화

    // 개발 편의
    compileOnly 'org.projectlombok:lombok'                                     // Lombok 컴파일 지원
    annotationProcessor 'org.projectlombok:lombok'                             // Lombok 코드 생성
    developmentOnly 'org.springframework.boot:spring-boot-devtools'             // 개발 중 자동 재시작

    // 테스트
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'   // JPA 테스트 지원
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'   // Security 테스트 지원
    testImplementation 'org.springframework.boot:spring-boot-starter-thymeleaf-test'  // Thymeleaf 테스트 지원
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'     // MVC 테스트 지원
    testCompileOnly 'org.projectlombok:lombok'                                      // 테스트 Lombok 컴파일 지원
    testAnnotationProcessor 'org.projectlombok:lombok'                              // 테스트 Lombok 코드 생성
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'                     // JUnit Platform 실행기
}

hibernate {
    enhancement {
    }
}

tasks.named('test') {
    useJUnitPlatform()
}
