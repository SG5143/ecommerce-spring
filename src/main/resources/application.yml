spring:
  application:
    name: Mingler
  profiles:
    active: local

  # 아래는 예시 설정입니다.
  # 로컬에서 실행할 때는 이 파일을 복사해 application-local.yml 을 만들고
  # 본인 환경에 맞게 값을 수정하세요. (application-local.yml 은 git 에 올라가지 않습니다.)
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: "jdbc:mysql://localhost:3306/mingler?serverTimezone=Asia/Seoul"
    username: your-db-username
    password: your-db-password
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  # 자동 WARN 로깅을 끄고 GlobalExceptionHandler 에서 로깅을 처리
  mvc:
    log-resolved-exception: false

# JWT 설정 (실제 secret 값은 application-local.yml 에 두고 git 에 올리지 않는다)
# secret 은 HS256 서명용 256bit 이상 Base64 문자열이어야 한다.
jwt:
  secret: "change-me-to-a-base64-encoded-256bit-secret-key-value-here=="
  access-token-validity: PT30M   # Access 토큰 수명 (짧게 유지해 탈취 피해 최소화)
  refresh-token-validity: P14D   # Refresh 토큰 수명
