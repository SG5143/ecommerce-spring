spring:
  application:
    name: Mingler
  profiles:
    default: local

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    baseline-version: 1
  sql:
    init:
      mode: never

  # 자동 WARN 로깅을 끄고 GlobalExceptionHandler 에서 로깅을 처리
  mvc:
    log-resolved-exception: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

# JWT 설정
jwt:
  access-token-validity: PT30M
  refresh-token-validity: P14D

payment:
  # 레거시 준비 요청에 paymentProvider가 없을 때 사용할 기본값입니다.
  provider: ${PAYMENT_PROVIDER:toss}
  toss:
    client-key: ${TOSS_CLIENT_KEY:}
    secret-key: ${TOSS_SECRET_KEY:}
    base-url: https://api.tosspayments.com
    test-code: ${TOSS_TEST_CODE:}
    # 토스 API 서버와 연결을 맺을 때까지 기다리는 최대 시간
    connect-timeout: ${TOSS_CONNECT_TIMEOUT:PT3S}
    # 연결 후 토스 API 응답을 기다리는 최대 시간
    read-timeout: ${TOSS_READ_TIMEOUT:PT10S}
  reconciliation:
    # 결과가 불명확한 PROCESSING 결제를 다시 조회하는 작업의 실행 간격
    fixed-delay: ${PAYMENT_RECONCILE_FIXED_DELAY:PT30S}
    # PROCESSING 전환 후 이 시간이 지난 결제부터 재조정 대상으로 조회
    processing-age: ${PAYMENT_RECONCILE_PROCESSING_AGE:PT10S}
    # 결제를 찾을 수 없는 상태가 이 시간 이상 지속되면 만료 실패로 확정
    expiry-grace: ${PAYMENT_RECONCILE_EXPIRY_GRACE:PT15M}
    # 결제창 인증을 시작하지 않은 PENDING 준비 건을 취소할 때 적용하는 유효시간
    preparation-ttl: ${PAYMENT_PREPARATION_TTL:PT30M}
    # 재조정 작업 한 번에 처리할 최대 결제 건수
    batch-size: ${PAYMENT_RECONCILE_BATCH_SIZE:100}

order:
  expiration:
    # 주문 생성 후 결제를 시작하거나 완료할 수 있는 최대 시간
    ttl: ${ORDER_EXPIRATION_TTL:PT30M}
    # 오래된 결제 대기 주문을 정리하는 주기
    fixed-delay: ${ORDER_EXPIRATION_FIXED_DELAY:PT1M}
    # 한 번에 만료 처리할 최대 주문 건수
    batch-size: ${ORDER_EXPIRATION_BATCH_SIZE:100}
