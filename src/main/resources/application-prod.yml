spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  flyway:
    enabled: false

logging:
  level:
    root: info
    com.zaxxer.hikari.HikariConfig: info
    org.hibernate.SQL: "off"
  structured:
    format:
      console: logstash

jwt:
  secret: ${JWT_SECRET}
