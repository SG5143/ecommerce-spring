<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>주문 완료 - Mingler</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/images/favicon.svg}"/>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
    <script th:src="@{/js/checkout-state.js}" defer></script>
    <script th:src="@{/js/checkout-complete.js}" defer></script>
</head>
<body>
<div th:replace="~{layout/header :: header}"></div>

<main class="checkout-page checkout-complete-page">
    <ol class="checkout-steps" aria-label="주문 진행 단계">
        <li>01 주문서 작성</li>
        <li>02 결제</li>
        <li class="is-current" aria-current="step">03 완료</li>
    </ol>

    <div id="checkout-complete-content" hidden>
        <div class="checkout-complete-head">
            <span class="checkout-complete-mark" aria-hidden="true">✓</span>
            <h1>결제가 완료되었습니다.</h1>
            <p>주문해주셔서 감사합니다.</p>
        </div>

        <section class="checkout-complete-card">
            <h2>결제 정보</h2>
            <dl class="checkout-complete-details">
                <div><dt>주문번호</dt><dd id="complete-order-number"></dd></div>
                <div><dt>결제번호</dt><dd id="complete-payment-number"></dd></div>
                <div><dt>결제상태</dt><dd id="complete-payment-status"></dd></div>
                <div><dt>주문상태</dt><dd id="complete-order-status"></dd></div>
                <div><dt>결제수단</dt><dd id="complete-payment-method"></dd></div>
                <div><dt>승인일시</dt><dd id="complete-approved-at"></dd></div>
                <div><dt>가상 PG 거래키</dt><dd id="complete-pg-key"></dd></div>
                <div class="checkout-complete-amount"><dt>결제금액</dt><dd id="complete-amount"></dd></div>
            </dl>
        </section>

        <section class="checkout-complete-card">
            <h2>주문 상품</h2>
            <ul id="complete-order-items" class="checkout-order-items checkout-order-items-large"></ul>
        </section>

        <div class="checkout-complete-actions">
            <a th:href="@{/}" class="checkout-primary-link" data-complete-leave>쇼핑 계속하기</a>
            <a th:href="@{/cart}" class="checkout-outline-link" data-complete-leave>장바구니 확인</a>
        </div>
        <p class="checkout-complete-notice">현재 결제 완료 상품은 장바구니에 유지됩니다.</p>
    </div>
</main>

<div th:replace="~{layout/footer :: footer}"></div>
</body>
</html>
