<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>로그인 - Mingler</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/images/favicon.svg}"/>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
    <script th:src="@{/js/login.js}" defer></script>
</head>
<body>
<div th:replace="~{layout/header :: header}"></div>

<main class="login-page">
    <h1 class="login-title">로그인</h1>

    <form class="login-form">
        <input type="text" name="username" class="login-input" placeholder="아이디" autocomplete="username"/>
        <input type="password" name="password" class="login-input" placeholder="비밀번호" autocomplete="current-password"/>
        <p class="login-message" role="alert" aria-live="polite"></p>
        <button type="submit" class="login-submit">로그인</button>
    </form>

    <div class="login-helper-links">
        <a th:href="@{/find-id}" class="not-implemented">아이디 찾기</a>
        <span>|</span>
        <a th:href="@{/find-password}" class="not-implemented">비밀번호 찾기</a>
        <span>|</span>
        <a th:href="@{/guest-order}" class="not-implemented">비회원 주문조회</a>
    </div>

    <div class="social-login">
        <a th:href="@{/oauth2/authorization/kakao}" class="social-login-button social-login-kakao not-implemented">
            <img th:src="@{/images/icons/kakao.png}" alt="" class="social-login-icon"/>
            <span>카카오톡 로그인</span>
        </a>
        <a th:href="@{/oauth2/authorization/naver}" class="social-login-button social-login-naver not-implemented">
            <img th:src="@{/images/icons/naver.png}" alt="" class="social-login-icon"/>
            <span>네이버 로그인</span>
        </a>
    </div>

<!--    <ul class="login-benefits">-->
<!--        <li>1. 회원가입 시, 바로 사용 가능한 5,000원 적립금 지급</li>-->
<!--    </ul>-->

    <a th:href="@{/signup}" class="login-signup-button">회원가입</a>
</main>

<div th:replace="~{layout/footer :: footer}"></div>
</body>
</html>
