<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Mingler | 회원정보</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/images/favicon.svg}"/>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
    <script th:src="@{/js/api.js}" defer></script>
    <script th:src="@{/js/member-info.js}" defer></script>
    <script src="//t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js" defer></script>
</head>
<body>
<div th:replace="~{layout/header :: header}"></div>

<main class="myshop-page">
    <div class="myshop-layout">
        <div th:replace="~{layout/myshop-nav :: nav('member-info')}"></div>

        <section class="myshop-content">
            <div class="myshop-content-head">
                <h1 class="myshop-title">회원정보</h1>
            </div>

            <form class="member-info-form" id="member-info-form">
                <!-- 아이디: 수정 불가 -->
                <div class="member-info-row">
                    <label for="mi-username">아이디</label>
                    <input type="text" id="mi-username" name="username" class="member-info-input" readonly/>
                </div>

                <div class="member-info-row">
                    <label for="mi-name">이름</label>
                    <input type="text" id="mi-name" name="name" class="member-info-input"/>
                </div>

                <div class="member-info-row has-hint">
                    <label for="mi-email">이메일</label>
                    <input type="email" id="mi-email" name="email" class="member-info-input" placeholder="이메일을 입력해주세요."/>
                    <p class="member-info-error" id="mi-email-error"></p>
                </div>

                <div class="member-info-row">
                    <label for="mi-phone1">휴대폰</label>
                    <div class="member-info-group">
                        <input type="tel" id="mi-phone1" name="phone1" class="member-info-input" maxlength="3" inputmode="numeric" readonly/>
                        <span class="member-info-sep">-</span>
                        <input type="tel" id="mi-phone2" name="phone2" class="member-info-input" maxlength="4" inputmode="numeric" readonly/>
                        <span class="member-info-sep">-</span>
                        <input type="tel" id="mi-phone3" name="phone3" class="member-info-input" maxlength="4" inputmode="numeric" readonly/>
                        <button type="button" id="mi-phone-verify-button" class="member-info-inline-btn">번호수정</button>
                    </div>
                </div>

                <div class="member-info-row">
                    <label for="mi-zipcode">우편번호</label>
                    <div class="member-info-inline">
                        <input type="text" id="mi-zipcode" name="zipcode" class="member-info-input" readonly/>
                        <button type="button" id="mi-zipcode-search-button" class="member-info-inline-btn">검색</button>
                    </div>
                </div>

                <div class="member-info-row">
                    <label for="mi-address">기본주소</label>
                    <input type="text" id="mi-address" name="address" class="member-info-input" readonly/>
                </div>

                <div class="member-info-row">
                    <label for="mi-address-detail">상세주소</label>
                    <input type="text" id="mi-address-detail" name="addressDetail" class="member-info-input" placeholder="상세주소"/>
                </div>

                <!-- 생년월일: 선택박스가 아닌 직접 입력 (연·월·일 3칸) -->
                <div class="member-info-row has-hint">
                    <label for="mi-birth-year">생년월일</label>
                    <div class="member-info-group">
                        <input type="text" id="mi-birth-year" name="birthYear" class="member-info-input" placeholder="YYYY" maxlength="4" inputmode="numeric"/>
                        <span class="member-info-unit">년</span>
                        <input type="text" id="mi-birth-month" name="birthMonth" class="member-info-input" placeholder="MM" maxlength="2" inputmode="numeric"/>
                        <span class="member-info-unit">월</span>
                        <input type="text" id="mi-birth-day" name="birthDay" class="member-info-input" placeholder="DD" maxlength="2" inputmode="numeric"/>
                        <span class="member-info-unit">일</span>
                    </div>
                    <p class="member-info-error" id="mi-birth-error"></p>
                </div>

                <div class="member-info-row">
                    <label>마케팅 수신동의</label>
                    <div class="member-info-radio-group">
                        <label class="terms-row">
                            <input type="radio" class="terms-checkbox" name="marketingAgreed" value="true" id="mi-marketing-yes"/>
                            <span class="terms-checkbox-icon"></span>
                            <span class="terms-row-text">동의함</span>
                        </label>
                        <label class="terms-row">
                            <input type="radio" class="terms-checkbox" name="marketingAgreed" value="false" id="mi-marketing-no"/>
                            <span class="terms-checkbox-icon"></span>
                            <span class="terms-row-text">동의안함</span>
                        </label>
                    </div>
                </div>

                <div class="member-info-row">
                    <label>이메일 수신여부</label>
                    <div class="member-info-radio-group channel-agreed-group">
                        <label class="terms-row">
                            <input type="radio" class="terms-checkbox" name="emailAgreed" value="true" id="mi-email-agreed-yes"/>
                            <span class="terms-checkbox-icon"></span>
                            <span class="terms-row-text">수신함</span>
                        </label>
                        <label class="terms-row">
                            <input type="radio" class="terms-checkbox" name="emailAgreed" value="false" id="mi-email-agreed-no"/>
                            <span class="terms-checkbox-icon"></span>
                            <span class="terms-row-text">수신안함</span>
                        </label>
                    </div>
                </div>

                <div class="member-info-row">
                    <label>SMS 수신여부</label>
                    <div class="member-info-radio-group channel-agreed-group">
                        <label class="terms-row">
                            <input type="radio" class="terms-checkbox" name="smsAgreed" value="true" id="mi-sms-agreed-yes"/>
                            <span class="terms-checkbox-icon"></span>
                            <span class="terms-row-text">수신함</span>
                        </label>
                        <label class="terms-row">
                            <input type="radio" class="terms-checkbox" name="smsAgreed" value="false" id="mi-sms-agreed-no"/>
                            <span class="terms-checkbox-icon"></span>
                            <span class="terms-row-text">수신안함</span>
                        </label>
                    </div>
                </div>

                <hr class="member-info-divider"/>

                <div class="member-info-row">
                    <label for="mi-current-password">현재 비밀번호</label>
                    <input type="password" id="mi-current-password" name="currentPassword" class="member-info-input" placeholder="비밀번호 변경 시 입력" autocomplete="current-password"/>
                </div>

                <div class="member-info-row has-hint">
                    <label for="mi-new-password">새 비밀번호</label>
                    <input type="password" id="mi-new-password" name="newPassword" class="member-info-input" placeholder="영문, 숫자, 특수문자(!@#$%^*+=.-) 중 2가지 이상 조합 8~20자" autocomplete="new-password"/>
                    <p class="member-info-error" id="mi-new-password-error"></p>
                </div>

                <div class="member-info-row has-hint">
                    <label for="mi-new-password-confirm">새 비밀번호 확인</label>
                    <input type="password" id="mi-new-password-confirm" name="newPasswordConfirm" class="member-info-input" autocomplete="new-password"/>
                    <p class="member-info-error" id="mi-new-password-confirm-error"></p>
                </div>

                <button type="button" id="mi-submit" class="member-info-submit">회원 정보 수정</button>

                <div class="member-info-withdraw-row">
                    <button type="button" id="mi-withdraw" class="member-info-withdraw">회원 탈퇴</button>
                </div>
            </form>
        </section>
    </div>

    <div class="modal-overlay" id="mi-phone-verify-overlay">
        <div class="modal-box" role="dialog" aria-modal="true">
            <button type="button" class="modal-close" id="mi-phone-verify-close" aria-label="닫기">&times;</button>
            <h2 class="modal-title">본인확인</h2>
            <p class="modal-message">현재 개발 중인 기능입니다.<br/>전화번호 입력 시 임시로 등록됩니다.</p>
            <input type="tel" id="mi-phone-verify-input" class="member-info-input" placeholder="010-1234-1234" inputmode="numeric" maxlength="13"/>
            <button type="button" class="member-info-submit" id="mi-phone-verify-confirm">확인</button>
        </div>
    </div>

    <div class="modal-overlay" id="mi-zipcode-search-overlay">
        <div class="modal-box modal-box-wide" role="dialog" aria-modal="true">
            <button type="button" class="modal-close" id="mi-zipcode-search-close" aria-label="닫기">&times;</button>
            <h2 class="modal-title">우편번호 검색</h2>
            <div id="mi-zipcode-search-embed" class="zipcode-search-embed"></div>
        </div>
    </div>

    <div class="modal-overlay" id="mi-withdraw-overlay">
        <div class="modal-box" role="dialog" aria-modal="true">
            <button type="button" class="modal-close" id="mi-withdraw-close" aria-label="닫기">&times;</button>
            <h2 class="modal-title">회원 탈퇴</h2>
            <p class="modal-message">보유 적립금: <strong id="mi-withdraw-points">-</strong><br/>회원 탈퇴 시 보유한 적립금은 모두 삭제됩니다.<br/>동일한 아이디와 SNS 계정으로는 재가입할 수 없습니다.<br/>정말로 탈퇴하시겠습니까?</p>
            <div class="member-info-modal-actions">
                <button type="button" class="member-info-modal-cancel" id="mi-withdraw-cancel">취소</button>
                <button type="button" class="member-info-modal-danger" id="mi-withdraw-confirm">탈퇴하기</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="mi-result-overlay">
        <div class="modal-box" role="dialog" aria-modal="true">
            <button type="button" class="modal-close" id="mi-result-close" aria-label="닫기">&times;</button>
            <h2 class="modal-title" id="mi-result-title"></h2>
            <p class="modal-message" id="mi-result-message"></p>
        </div>
    </div>
</main>

<div th:replace="~{layout/footer :: footer}"></div>
</body>
</html>
