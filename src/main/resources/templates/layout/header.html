<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<header class="site-header" th:fragment="header">
    <div class="header-inner">
        <button type="button" class="hamburger-btn" aria-label="메뉴 열기" aria-expanded="false" aria-controls="mobile-nav-drawer">
            <img th:src="@{/images/icons/ham-w.svg}" alt="" class="hamburger-icon"/>
        </button>
        <a class="logo" th:href="@{/}">Mingler</a>
        <nav class="main-nav" th:if="${not #lists.isEmpty(headerCategories)}">
            <ul>
                <li class="has-dropdown" th:each="cat : ${headerCategories}">
                    <a th:href="@{/categories/{id}(id=${cat.id})}"
                       th:text="${cat.name}">카테고리</a>
                    <ul class="dropdown-menu" th:if="${not #lists.isEmpty(cat.children)}">
                        <li th:each="child : ${cat.children}">
                            <a th:href="@{/categories/{id}(id=${child.id})}"
                               th:text="${child.name}">하위 카테고리</a>
                        </li>
                    </ul>
                </li>
            </ul>
        </nav>
        <div class="header-icons">
            <a th:href="@{/search}" class="icon-link not-implemented" aria-label="검색">
                <img th:src="@{/images/icons/sch-b.svg}" alt="검색"/>
            </a>
            <a th:href="@{/login}" id="header-my-link" class="icon-link" aria-label="마이페이지">
                <img th:src="@{/images/icons/my-b.svg}" alt="마이페이지"/>
            </a>
            <a th:href="@{/cart}" class="icon-link not-implemented" aria-label="장바구니">
                <img th:src="@{/images/icons/cart-b.svg}" alt="장바구니"/>
            </a>
        </div>
    </div>

    <div class="mobile-nav-overlay" id="mobile-nav-overlay"></div>
    <nav class="mobile-nav-drawer" id="mobile-nav-drawer" aria-hidden="true">
        <ul>
            <li class="mobile-nav-group" th:each="cat : ${headerCategories}">
                <button type="button" class="mobile-cat-toggle" aria-expanded="false"
                        th:if="${not #lists.isEmpty(cat.children)}">
                    <span th:text="${cat.name}">카테고리</span>
                    <span class="accordion-arrow" aria-hidden="true"></span>
                </button>
                <a th:href="@{/categories/{id}(id=${cat.id})}"
                   th:unless="${not #lists.isEmpty(cat.children)}" th:text="${cat.name}">카테고리</a>
                <ul class="mobile-subnav" th:if="${not #lists.isEmpty(cat.children)}">
                    <li th:each="child : ${cat.children}">
                        <a th:href="@{/categories/{id}(id=${child.id})}"
                           th:text="${child.name}">하위 카테고리</a>
                    </li>
                </ul>
            </li>
        </ul>
    </nav>

    <script th:src="@{/js/header.js}" defer></script>
    <script th:src="@{/js/auth-ui.js}" defer></script>
</header>
</body>
</html>
